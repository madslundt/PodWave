services:
  podwave:
    build: .
    container_name: podwave
    ports:
      - "8080:8080"
    environment:
      # Optional: seed keys here instead of editing data/config.json in the UI.
      # PODWAVE_LLM_KEY: sk-...
      # PODWAVE_TTS_KEY: sk-...
      # PODWAVE_SEARCH_KEY: tvly-...
      # No login or token: whoever can reach port 8080 can use the server and its library.
      PODWAVE_BIND: 0.0.0.0
    volumes:
      - ./data:/data
    restart: unless-stopped
